<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>MOB — Prototype</title>
<style>
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body {
    margin: 0; height: 100%;
    background: #0e0e10;
    font-family: -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    color: #e8e6e3;
    overscroll-behavior: none;
  }
  body { display: flex; justify-content: center; }
  #app {
    width: 100%; max-width: 480px;
    height: 100vh; height: 100dvh;
    background: #17181a;
    display: flex; flex-direction: column;
    border-left: 1px solid #26272a; border-right: 1px solid #26272a;
    position: relative;
    overflow: hidden;
  }

  /* ---- Top bar: header + HUD, always visible ---- */
  #topbar { flex-shrink: 0; z-index: 5; }
  header {
    padding: 10px 14px; background: #1c1d20; border-bottom: 1px solid #2a2b2e;
    display: flex; align-items: center; gap: 10px;
  }
  header .avatar {
    width: 34px; height: 34px; border-radius: 50%; background: #3a2f26;
    display: flex; align-items: center; justify-content: center; font-size: 16px; flex-shrink: 0;
  }
  header .title { font-weight: 600; font-size: 14px; }
  header .sub { font-size: 10.5px; color: #8a8a8f; }
  #hud {
    display: grid; grid-template-columns: repeat(4, 1fr); gap: 1px;
    background: #26272a; border-bottom: 1px solid #26272a; cursor: pointer;
  }
  #hud .cell { background: #1c1d20; padding: 6px 4px; text-align: center; }
  #hud .cell .v { font-size: 12.5px; font-weight: 600; }
  #hud .cell .l { font-size: 8.5px; color: #8a8a8f; text-transform: uppercase; letter-spacing: 0.04em; }
  #hud .energy .v { color: #f2c14e; }
  #hud .money .v { color: #6fcf97; }
  #hud .respect .v { color: #d97757; }
  #hud .heat .v { color: #eb5757; }
  #xpbar { height: 3px; background: #2a2b2e; }
  #xpbar .fill { height: 100%; background: #6fcf97; transition: width .3s; }

  /* ---- Main content: single screen, replaced not appended ---- */
  #content { flex: 1; overflow-y: auto; padding: 12px 12px 14px; -webkit-overflow-scrolling: touch; }
  #content::-webkit-scrollbar { width: 4px; }
  #content::-webkit-scrollbar-thumb { background: #333; border-radius: 3px; }

  /* ---- Bottom nav ---- */
  #bottomnav {
    flex-shrink: 0; display: grid; grid-template-columns: repeat(5, 1fr);
    background: #1c1d20; border-top: 1px solid #2a2b2e;
    padding-bottom: env(safe-area-inset-bottom, 0);
  }
  #bottomnav button {
    background: none; border: none; color: #75767c; padding: 7px 2px 8px;
    display: flex; flex-direction: column; align-items: center; gap: 2px;
    font-size: 9.5px; cursor: pointer; font-family: inherit;
  }
  #bottomnav button .ic { font-size: 18px; }
  #bottomnav button.active { color: #6fcf97; }

  /* ---- Generic building blocks ---- */
  .card {
    background: #1e1f22; border: 1px solid #2a2b2e; border-radius: 12px;
    padding: 12px; margin-bottom: 10px;
  }
  .card h3 { margin: 0 0 4px; font-size: 14px; }
  .card p { margin: 0; font-size: 12.5px; color: #a9a9ae; line-height: 1.5; }
  .row { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
  .pill-row { display: flex; gap: 6px; overflow-x: auto; padding-bottom: 8px; margin-bottom: 4px; -webkit-overflow-scrolling: touch; }
  .pill-row::-webkit-scrollbar { display: none; }
  .pill {
    flex-shrink: 0; background: #202124; border: 1px solid #333437; color: #c8c8cc;
    border-radius: 999px; padding: 6px 13px; font-size: 12px; cursor: pointer; white-space: nowrap;
  }
  .pill.active { background: #2b4a3f; border-color: #3a6b52; color: #8fe0b8; }

  .action-btn {
    width: 100%; text-align: left; background: #202124; border: 1px solid #2f3033;
    border-radius: 10px; padding: 10px 12px; margin-bottom: 8px; cursor: pointer;
    color: #e8e6e3; font-family: inherit; font-size: 12.5px;
  }
  .action-btn:active { background: #26282c; }
  .action-btn:disabled { opacity: 0.4; cursor: not-allowed; }
  .action-btn .abtitle { font-weight: 600; font-size: 13px; margin-bottom: 2px; }
  .action-btn .absub { color: #9a9a9f; font-size: 11.5px; }
  .action-btn.primary { border-color: #3a6b52; }
  .action-btn.primary .abtitle { color: #8fe0b8; }

  .btn { background: #2b4a3f; color: #8fe0b8; border: none; border-radius: 10px; padding: 11px; font-size: 13px; font-family: inherit; cursor: pointer; width: 100%; }
  .btn:disabled { opacity: 0.4; cursor: not-allowed; }
  .btn.secondary { background: #202124; color: #e8e6e3; border: 1px solid #333437; }
  .btn.small { padding: 8px; font-size: 12px; }
  .btn-row { display: flex; gap: 8px; margin-top: 8px; }
  .btn-row .btn { flex: 1; }

  .grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
  .bigcard {
    background: #1e1f22; border: 1px solid #2a2b2e; border-radius: 12px; padding: 12px 10px 10px;
    text-align: center; cursor: pointer;
  }
  .bigcard:active { background: #232427; }
  .bigcard .ic { font-size: 22px; margin-bottom: 4px; }
  .bigcard .badgeimg { height: 52px; width: auto; margin-bottom: 4px; filter: drop-shadow(0 2px 6px rgba(0,0,0,0.5)); }
  .bigcard .lb { font-size: 12px; font-weight: 600; }

  .barwrap { background: #2a2b2e; border-radius: 4px; height: 6px; overflow: hidden; margin-top: 3px; }
  .bar { height: 100%; background: #6fcf97; }

  .tiny { font-size: 10.5px; color: #83838a; }
  .statline { display: flex; justify-content: space-between; font-size: 12.5px; padding: 4px 0; border-bottom: 1px solid #242528; }
  .statline:last-child { border-bottom: none; }
  .statline b { color: #e8e6e3; }

  .badge { display: inline-block; background: #26272a; border-radius: 6px; padding: 1px 7px; font-size: 10.5px; margin-left: 4px; }
  .badge.rare { color: #6fcf97; }
  .badge.epic { color: #b39ddb; }
  .badge.legendary { color: #f2c14e; }
  .badge.common { color: #9a9a9f; }

  .empty-hint { text-align: center; color: #83838a; font-size: 12.5px; padding: 24px 10px; }

  /* ---- Toasts ---- */
  #toasts {
    position: absolute; left: 0; right: 0; bottom: 62px; z-index: 30;
    display: flex; flex-direction: column; align-items: center; gap: 6px; pointer-events: none; padding: 0 12px;
  }
  .toast {
    max-width: 100%; background: #232427; border: 1px solid #333437; border-left: 3px solid #6fcf97;
    border-radius: 10px; padding: 9px 13px; font-size: 12.5px; line-height: 1.45;
    box-shadow: 0 6px 18px rgba(0,0,0,0.4); animation: toastin .18s ease-out;
    white-space: pre-wrap;
  }
  .toast.warn { border-left-color: #eb5757; }
  .toast.levelup { border-left-color: #f2c14e; background: #2a2418; }
  .toast.chatter { border-left-color: #b39ddb; background: #221f2a; font-style: italic; color: #cfc3e8; }
  @keyframes toastin { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: translateY(0); } }
  .toast.fadeout { animation: toastout .25s ease-in forwards; }
  @keyframes toastout { to { opacity: 0; transform: translateY(-6px); } }

  /* ---- Onboarding overlay ---- */
  #onboarding {
    position: absolute; inset: 0; background: #121214; z-index: 50;
    display: flex; flex-direction: column; justify-content: center; padding: 22px;
    overflow-y: auto;
  }
  #onboarding h1 { font-size: 22px; margin: 0 0 6px; }
  #onboarding .lead { color: #a9a9ae; font-size: 13.5px; line-height: 1.6; margin-bottom: 18px; }
  #onboarding input {
    width: 100%; background: #1e1f22; border: 1px solid #333437; border-radius: 10px;
    padding: 12px 14px; color: #e8e6e3; font-size: 15px; margin-bottom: 12px; font-family: inherit;
  }
  #onboarding input:focus { outline: none; border-color: #6fcf97; }
  .faction-card {
    background: #1e1f22; border: 1px solid #2a2b2e; border-radius: 12px; padding: 12px 14px;
    margin-bottom: 8px; cursor: pointer;
  }
  .faction-card:active { background: #232427; }
  .faction-card .fname { font-weight: 600; font-size: 14px; }
  .faction-card .fdesc { font-size: 12px; color: #9a9a9f; margin-top: 2px; }
</style>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
</head>
<body>
<div id="app">
  <div id="topbar">
    <header>
      <div class="avatar">🕵️</div>
      <div>
        <div class="title">MOB</div>
        <div class="sub" id="headerSub">Underworld</div>
      </div>
    </header>
    <div id="hud" style="display:none;" onclick="openHeatModal()">
      <div class="cell energy"><div class="v" id="hudEnergy">-</div><div class="l">Energy</div></div>
      <div class="cell money"><div class="v" id="hudMoney">-</div><div class="l">Money</div></div>
      <div class="cell respect"><div class="v" id="hudRespect">-</div><div class="l">Respect</div></div>
      <div class="cell heat"><div class="v" id="hudHeat">-</div><div class="l">Heat</div></div>
    </div>
    <div id="xpbar" style="display:none;"><div class="fill" id="xpfill" style="width:0%"></div></div>
  </div>

  <main id="content"></main>

  <nav id="bottomnav" style="display:none;">
    <button data-tab="home" onclick="setTab('home')"><span class="ic">🏠</span>Home</button>
    <button data-tab="jobs" onclick="setTab('jobs')"><span class="ic">🎯</span>Jobs</button>
    <button data-tab="crime" onclick="setTab('crime')"><span class="ic">⚔️</span>Crime</button>
    <button data-tab="cards" onclick="setTab('cards')"><span class="ic">🃏</span>Cards</button>
    <button data-tab="profile" onclick="setTab('profile')"><span class="ic">👤</span>Profile</button>
  </nav>

  <div id="toasts"></div>

  <div id="onboarding">
    <div id="onboardingInner"></div>
  </div>
</div>

let authSession = null; // { access_token, user: {...} } once logged in

/* --- Backend API client: every call attaches the current Supabase auth token.
   This is the ONLY way the game reads/writes real state now — there is no local
   computation of rewards anymore for anything wired to the backend. --- */
async function apiCall(method, path, body) {
  const headers = { 'Content-Type': 'application/json' };
  if (authSession && authSession.access_token) {
    headers['Authorization'] = 'Bearer ' + authSession.access_token;
  }
  let res;
  try {
    res = await fetch(API_BASE_URL + path, {
      method, headers,
      body: body ? JSON.stringify(body) : undefined,
    });
  } catch (e) {
    throw { status: 0, message: 'Could not reach the server. Is the backend running at ' + API_BASE_URL + '?' };
  }
  let data = null;
  try { data = await res.json(); } catch (e) { /* empty body */ }
  if (!res.ok) {
    throw { status: res.status, message: (data && data.error) || ('Request failed (' + res.status + ')') };
  }
  return data;
}

function randomRival(pp) {
  const variance = 0.7 + Math.random() * 0.6;
  const power = Math.max(15, Math.round(pp * variance));
  const attackShare = 0.4 + Math.random() * 0.2;
  const attack = Math.round(power * attackShare);
  const defense = Math.round(power * (1 - attackShare));
  const crewSize = Math.floor(Math.random() * 4);
  const title = RIVAL_TITLES[Math.floor(Math.random()*RIVAL_TITLES.length)];
  const crew = RIVAL_CREWS[Math.floor(Math.random()*RIVAL_CREWS.length)];
  return {
    id: 'v' + Math.random().toString(36).slice(2,9),
    name: title + ' of ' + crew,
    attack, defense, crewSize,
    moneyStake: Math.round(power * (4 + Math.random()*4)),
    respectStake: Math.max(2, Math.round(power * 0.15))
  };
}

function playerPower() {
  return state.attack + gangAttack(state.gang) + state.defense + gangDefense(state.gang);
}

function districtTemplate(id) { return DISTRICTS_DATA.find(d => d.id === id); }
function rivalTemplate(id) { return NAMED_RIVALS_DATA.find(r => r.id === id); }
function districtsHeldBy(ownerId) { return state.districts.filter(d => d.ownerId === ownerId); }
function playerDistricts() { return districtsHeldBy('player'); }

function rivalEffectivePower(rivalId) {
  const rival = rivalTemplate(rivalId);
  const heldCount = districtsHeldBy(rivalId).length;
  const grudge = (state.rivalGrudge[rivalId] || 0);
  const grudgeMult = 1 + Math.min(0.4, grudge * 0.08);
  return Math.round((rival.basePower + heldCount * 10) * grudgeMult);
}

function pendingIncome(d) {
  const tpl = districtTemplate(d.id);
  const elapsedHours = Math.min(INCOME_CAP_HOURS, (Date.now() - d.lastCollected) / 3600000);
  return Math.floor(tpl.baseIncome * TIER_MULT[d.tier] * elapsedHours);
}
function totalPendingIncome() {
  return playerDistricts().reduce((sum, d) => sum + pendingIncome(d), 0);
}

function computeEpithet() {
  const count = playerDistricts().length;
  if (count === 0) return null;
  const tierNames = ['', 'Rising Player', 'Turf Boss', 'Turf Boss', 'Kingpin', 'Kingpin', 'Kingpin', 'Emperor of the Underworld', 'Emperor of the Underworld'];
  const base = tierNames[Math.min(count, tierNames.length - 1)];
  const scores = {
    Violent: state.pvpWins * 3 + state.hitsCompleted * 2,
    Feared: state.hitsCompleted * 3 + state.heat,
    Cunning: state.tournamentWins * 3 + state.cards.length,
    Wealthy: Math.floor(state.money / 100)
  };
  const dominant = Object.entries(scores).sort((a,b) => b[1]-a[1])[0][0];
  return `The ${dominant} ${base}`;
}

function chatter(message) {
  toast(message, 'chatter');
}
function rankChatterLine(rank) {
  const lines = {
    'Associate': `You're not just some punk off the street anymore. People are starting to notice.`,
    'Soldier': `The crew respects you now. That doesn't happen by accident.`,
    'Capo': `Capo. Other bosses are starting to ask around about you.`,
    'Underboss': `Underboss. You're two steps from running this whole city.`,
    'Boss': `Boss. Say it slow — you earned that title.`,
    'Don': `Don. There are people who've been in this life thirty years who never got that name.`,
    'Godfather': `Godfather. There's nobody above you now. The city is yours.`
  };
  return lines[rank] || `You've been promoted to ${rank}.`;
}

  const total = CARD_RARITIES.reduce((s, r) => s + r.weight, 0);
  let roll = Math.random() * total;
  for (const r of CARD_RARITIES) {
    if (roll < r.weight) return r;

  return CARD_RARITIES[0];

function heatLabel(h) {
  if (h < 20) return 'Low';
  if (h < 45) return 'Med';
  if (h < 70) return 'High';
  if (h < 90) return 'Wanted';
  return 'MOST WANTED';
}
function heatTier(h) {
  if (h < 20) return 'low';
  if (h < 45) return 'medium';
  if (h < 70) return 'high';
  if (h < 90) return 'wanted';
  return 'mostwanted';
}

function rollHeatEvent() {
  const tier = heatTier(state.heat);
  if (tier === 'low') return null;
  if (tier === 'medium') {
    if (Math.random() < 0.18) {
      const fine = Math.min(state.money, 20 + Math.floor(Math.random() * 30));
      state.money -= fine;
      return { cls: 'warn', text: `🚓 Random Inspection. Local police stopped you for a look.\n-$${fine}` };
    }
    return null;
  }
  if (tier === 'high') {
    const roll = Math.random();
    if (roll < 0.12) {
      const fine = Math.min(state.money, Math.round(state.money * 0.25) + 40);
      const energyLoss = Math.min(state.energy, 25);
      state.money -= fine;
      state.energy -= energyLoss;
      state.heat = Math.max(0, state.heat - 15);
      return { cls: 'warn', text: `🚨 Police Raid! They hit one of your spots.\n-$${fine}  -${energyLoss}⚡  🌡 Heat -15` };
    }
    if (roll < 0.30) {
      const fine = Math.min(state.money, 30 + Math.floor(Math.random() * 40));
      state.money -= fine;
      return { cls: 'warn', text: `🚓 Random Inspection. They searched you at a checkpoint.\n-$${fine}` };
    }
    return null;
  }
  return null;
}

function esc(s) { return String(s).replace(/[&<>]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;'}[c])); }

function pushLog(text) {
  if (!state) return;
  state.log.unshift({ text, t: Date.now() });
  state.log = state.log.slice(0, 8);
}

function toast(message, cls) {
  const el = document.createElement('div');
  el.className = 'toast' + (cls ? ' ' + cls : '');
  el.innerHTML = nl(message);
  $('toasts').appendChild(el);
  setTimeout(() => {
    el.classList.add('fadeout');
    setTimeout(() => el.remove(), 260);
  }, 2600);
  pushLog(message.replace(/\n/g, ' — '));
}

function updateHUD() {
  if (!state) return;
  if (!state.everWanted && heatTier(state.heat) === 'wanted') {
    state.everWanted = true;
    chatter(`The papers picked up your name today. You're Wanted now — that's not nothing.`);
  }
  $('hud').style.display = 'grid';
  $('xpbar').style.display = 'block';
  $('hudEnergy').textContent = state.energy + '/' + state.maxEnergy;
  $('hudMoney').textContent = '$' + state.money.toLocaleString();
  $('hudRespect').textContent = state.respect;
  $('hudHeat').textContent = heatLabel(state.heat);

  $('headerSub').textContent = state.name + (epithet ? ' "' + epithet.replace('The ', '') + '"' : '') + ' • ' + rankFor(state.level).name + ' • Lv.' + state.level;
  const need = xpForLevel(state.level);
  $('xpfill').style.width = Math.min(100, Math.round((state.xp/need)*100)) + '%';
}

async function doQuest(id) {
  const q = QUESTS.find(x => x.id === id);
  if (!q || state.energy < q.energy) { toast("Not enough energy for that job.", 'warn'); return; }

  try {
    const data = await apiCall('POST', '/players/me/quests/' + id);
    const p = data.player;
    state.energy = p.energy; state.money = p.money; state.respect = p.respect;
    state.heat = p.heat; state.level = p.level; state.xp = p.xp; state.questsDone = p.quests_done;

    toast(`${q.icon} ${data.reward.questName}: +$${data.reward.money}  +${data.reward.xp} XP  +${data.reward.respect} Respect`, 'reward');
    (data.levelUps || []).forEach(lu => {
      toast(`🎉 LEVEL UP! Level ${lu.level} — promoted to ${lu.rank}.`, 'levelup');
    });
  } catch (e) {
    toast(e.message || 'Could not complete that job.', 'warn');
  }
  updateHUD();
  renderJobsBody();
}

function doSpecial(id) {
  const sq = SPECIAL_QUESTS.find(x => x.id === id);
  if (!sq || state.specialDone.includes(id)) return;
  state.specialDone.push(id);
  state.xpBoost = Math.min(20, state.xpBoost + sq.boost);
  toast(`${sq.name} done. XP boost now +${state.xpBoost}%.`, 'reward');
  updateHUD();
  renderJobsBody();
}

function gainXP(amount) {
  state.xp += amount;
  let need = xpForLevel(state.level);
  while (state.xp >= need) {
    state.xp -= need;
    state.level += 1;
    const oldRank = rankFor(state.level - 1).name;
    const newRank = rankFor(state.level).name;
    if (newRank !== oldRank) {
      toast(`🎉 LEVEL UP! Level ${state.level} — promoted to ${newRank}.`, 'levelup');
      chatter(rankChatterLine(newRank));
    }
    else toast(`🎉 LEVEL UP! Level ${state.level}.`, 'levelup');
    need = xpForLevel(state.level);
  }
}

let districtsCache = null;
async function renderTerritoryBody(el) {
  el.innerHTML = `<div class="tiny">Loading the map…</div>`;
  try {
    const data = await apiCall('GET', '/districts');
    districtsCache = data.districts;
  } catch (e) {
    el.innerHTML = `<div class="card"><p style="color:#eb5757;">Could not load the map: ${esc(e.message || 'unknown error')}</p></div>`;
    return;
  }

  const mine = districtsCache.filter(d => d.owner_type === 'player' && d.owner_ref === state.serverId);
  const totalIncome = mine.reduce((s, d) => s + Math.round(d.base_income * TIER_MULT[d.tier]), 0);
  const totalPending = mine.reduce((s, d) => s + (d.pendingIncome || 0), 0);

  const summary = `<div class="card">
      <h3>Your Empire</h3>
      <div class="statline"><span>Territories held</span><b>${mine.length} / ${districtsCache.length}</b></div>
      <div class="statline"><span>Combined income/hr</span><b>$${totalIncome}</b></div>
      ${totalPending > 0 ? `<div class="statline"><span>Waiting to collect</span><b style="color:#6fcf97;">$${totalPending}</b></div>` : ''}
      <p class="tiny" style="margin-top:6px;">This map is shared — every player is contesting the same 8 districts, live.</p>
    </div>`;

  const cards = districtsCache.map(d => {
    const isMine = d.owner_type === 'player' && d.owner_ref === state.serverId;
    if (isMine) {
      const ready = d.pendingIncome || 0;
      const upgradeCost = d.tier < 2 ? UPGRADE_COSTS[d.tier + 1] : null;
      return `<div class="card">
        <div class="row"><h3>${esc(d.name)}</h3><span class="badge rare">Yours</span></div>
        <p>${esc(d.business)} · Tier ${d.tier + 1}/3 · $${Math.round(d.base_income * TIER_MULT[d.tier])}/hr</p>
        <div class="btn-row">
          <button class="btn small" ${ready === 0 ? 'disabled' : ''} onclick="collectIncome('${d.id}')">💰 Collect $${ready}</button>
          ${upgradeCost ? `<button class="btn secondary small" ${state.money < upgradeCost ? 'disabled' : ''} onclick="upgradeBusiness('${d.id}')">⬆️ Upgrade $${upgradeCost}</button>` : `<button class="btn secondary small" disabled>Max Tier</button>`}
        </div>
      </div>`;
    }
    if (d.owner_type === 'neutral') {
      return `<div class="card">
        <div class="row"><h3>${esc(d.name)}</h3><span class="badge common">Unclaimed</span></div>
        <p>${esc(d.business)} · $${d.base_income}/hr once claimed</p>
        <button class="btn" ${state.money < NEUTRAL_CLAIM_COST ? 'disabled' : ''} onclick="claimNeutral('${d.id}')">🏳️ Move In — $${NEUTRAL_CLAIM_COST}</button>
      </div>`;
    }
    const isRealPlayer = d.owner_type === 'player';
    return `<div class="card">
      <div class="row"><h3>${esc(d.name)}</h3><span class="badge epic">${isRealPlayer ? '👤 ' : ''}${esc(d.ownerName || 'Unknown')}</span></div>
      <p>${esc(d.business)} · Held by ${esc(d.ownerName || 'Unknown')}${isRealPlayer ? ' — a real player' : ''}</p>
      <button class="btn" ${state.energy < TERRITORY_ATTACK_ENERGY_COST ? 'disabled' : ''} onclick="attackDistrict('${d.id}')">⚔️ Move on their turf — ${TERRITORY_ATTACK_ENERGY_COST}⚡</button>
    </div>`;
  }).join('');

  el.innerHTML = summary + cards;
}

const PVP_ENERGY_COST = 20;
function renderPvPBody(el) {
  if (heatBlocked()) { el.innerHTML = heatBlockedCard(); return; }
  if (state.rivals.length === 0) state.rivals = [randomRival(playerPower()), randomRival(playerPower()), randomRival(playerPower())];
  el.innerHTML = `<p class="tiny" style="margin-bottom:8px;">Winning takes their cash and respect — and sometimes their people. Losing costs you.</p>` +
    state.rivals.map(r => `
      <button class="action-btn" ${state.energy < PVP_ENERGY_COST ? 'disabled' : ''} onclick="attackRival('${r.id}')">
        <div class="abtitle">${esc(r.name)}</div>
        <div class="absub">⚔️${r.attack} 🛡${r.defense} 👥${r.crewSize} · ${PVP_ENERGY_COST}⚡</div>
      </button>
    `).join('') +
    `<button class="btn secondary small" style="margin-top:4px;" onclick="refreshRivals()">🔄 Scout new rivals</button>`;
}
function refreshRivals() {
  const p = playerPower();
  state.rivals = [randomRival(p), randomRival(p), randomRival(p)];
  renderCrimeBody();
}
function attackRival(id) {
  const r = state.rivals.find(x => x.id === id);
  if (!r || state.energy < PVP_ENERGY_COST) { toast("Not enough energy to move on them.", 'warn'); return; }
  state.energy -= PVP_ENERGY_COST;

  const myPower = state.attack + gangAttack(state.gang) + Math.round(Math.random() * 15);
  const theirPower = r.attack + Math.round(Math.random() * 15);
  const myDefRoll = state.defense + gangDefense(state.gang) + Math.round(Math.random() * 10);
  const theirDefRoll = r.defense + Math.round(Math.random() * 10);
  const won = myPower + myDefRoll > theirPower + theirDefRoll;

  state.heat = Math.min(100, state.heat + applyHeatGain(won ? 8 : 5));
  state.rivals = state.rivals.filter(x => x.id !== r.id);
  if (state.rivals.length === 0) state.rivals = [randomRival(playerPower()), randomRival(playerPower()), randomRival(playerPower())];

  if (won) {
    state.pvpWins += 1;
    state.money += r.moneyStake;
    state.respect += r.respectStake;
    let msg = `🏆 Beat ${r.name}: +$${r.moneyStake}  +${r.respectStake} Respect`;
    if (r.crewSize > 0 && Math.random() < 0.35) {
      const joined = randomRecruit();
      state.gang.push(joined);
      msg += `\n🤝 ${joined.name} switched sides and joined you!`;
    }
    toast(msg, 'reward');
  } else {
    state.pvpLosses += 1;
    const lost = Math.min(state.money, Math.round(r.moneyStake * 0.5));
    state.money -= lost;
    toast(`💥 Lost to ${r.name}: -$${lost}`, 'warn');
  }
  updateHUD();
  const event = rollHeatEvent();
  if (event) setTimeout(() => toast(event.text, event.cls), 500);
  renderCrimeBody();
}

// -- Hitlist --
const HIT_ENERGY_COST = 22;
function renderHitlistBody(el) {
  if (heatBlocked()) { el.innerHTML = heatBlockedCard(); return; }
  const incomingChance = Math.min(0.35, state.respect / 500);
  if (Math.random() < incomingChance) { resolveIncomingHit(); }
  if (state.hitlistBoard.length === 0) state.hitlistBoard = [randomContract(), randomContract(), randomContract()];
  el.innerHTML = `<p class="tiny" style="margin-bottom:8px;">Contracts on real names, posted by people who want a problem to disappear.</p>` +
    state.hitlistBoard.map(c => {
      const type = HIT_TYPES[c.typeKey];
      return `<button class="action-btn" ${state.energy < HIT_ENERGY_COST ? 'disabled' : ''} onclick="attemptHit('${c.id}')">
        <div class="abtitle">${esc(type.label)}: ${esc(c.name)}</div>
        <div class="absub">$${c.money} · +${c.respect} Respect · ${HIT_ENERGY_COST}⚡</div>
      </button>`;
    }).join('') +
    `<button class="btn secondary small" style="margin-top:4px;" onclick="refreshContracts()">🔄 Check new contracts</button>`;
}
function refreshContracts() {
  state.hitlistBoard = [randomContract(), randomContract(), randomContract()];
  renderCrimeBody();
}
function attemptHit(id) {
  const c = state.hitlistBoard.find(x => x.id === id);
  if (!c || state.energy < HIT_ENERGY_COST) { toast("Not enough energy for that contract.", 'warn'); return; }
  const type = HIT_TYPES[c.typeKey];
  state.energy -= HIT_ENERGY_COST;

  const myRoll = state.attack + gangAttack(state.gang) + state.luck + Math.round(Math.random() * 20);
  const targetRoll = c.targetDefense + c.targetLuck + Math.round(Math.random() * 20);
  const success = myRoll > targetRoll;

  state.hitlistBoard = state.hitlistBoard.filter(x => x.id !== c.id);
  if (state.hitlistBoard.length === 0) state.hitlistBoard = [randomContract(), randomContract(), randomContract()];

  if (success) {
    state.hitsCompleted += 1;
    state.money += c.money;
    state.respect += c.respect;
    state.heat = Math.min(100, state.heat + applyHeatGain(type.heat));
    toast(`☠️ Contract complete: ${c.name}. +$${c.money}  +${c.respect} Respect`, 'reward');
  } else {
    state.hitsFailed += 1;
    const lost = Math.min(state.money, 25 + Math.floor(Math.random() * 35));
    state.money -= lost;
    state.heat = Math.min(100, state.heat + applyHeatGain(Math.round(type.heat / 2)));
    toast(`${c.name} got away clean. -$${lost}`, 'warn');
  }
  updateHUD();
  renderCrimeBody();
}
function resolveIncomingHit() {
  const attackerPower = 15 + Math.round(Math.random() * 40);
  const myDefense = state.defense + gangDefense(state.gang) + state.luck + Math.round(Math.random() * 15);
  const survived = myDefense >= attackerPower;
  if (survived) {
    state.hitsSurvived += 1;
    state.respect += 3;
    toast("🎯 Someone put a hit on you — your people shut it down. +3 Respect.", 'reward');
  } else {
    const lost = Math.min(state.money, 40 + Math.floor(Math.random() * 60));
    state.money -= lost;
    toast(`🎯 Someone put a hit on you and got close. -$${lost}`, 'warn');
  }
  updateHUD();
}

function renderBlackMarket(inner) {
  const elapsed = Date.now() - state.sniperLastUsedAt;
  if (state.sniperLastUsedAt && elapsed < BLACK_MARKET_COOLDOWN_MS) {
    const remainingSec = Math.ceil((BLACK_MARKET_COOLDOWN_MS - elapsed) / 1000);
    inner.innerHTML = `<div class="card"><h3>🔫 Gun For Hire</h3>
      <p>Your contact's gone quiet — one job at a time. Back in ${remainingSec}s.</p>
      <div class="tiny">Stands in for the real game's 30-day cooldown.</div></div>`;
    return;
  }
  if (heatBlocked()) { inner.innerHTML = heatBlockedCard(); return; }
  if (!blackMarketTarget) blackMarketTarget = randomEliteTarget();
  const t = blackMarketTarget;
  inner.innerHTML = `<div class="card">
      <h3>🔫 Gun For Hire</h3>
      <p>One shot, one very well-paying contract — and a much bigger risk than street hits.</p>
      <div class="statline"><span>Target</span><b>${esc(t.name)}</b></div>
      <div class="statline"><span>Payout</span><b>$${t.money} · +${t.respect} Respect</b></div>
    </div>
    <button class="btn" ${state.energy < BLACK_MARKET_ENERGY_COST?'disabled':''} onclick="attemptSniper()">Take the contract — ${BLACK_MARKET_ENERGY_COST}⚡</button>`;
}
function attemptSniper() {
  const target = blackMarketTarget;
  if (!target || state.energy < BLACK_MARKET_ENERGY_COST) { toast("Not enough energy for that job.", 'warn'); return; }
  state.energy -= BLACK_MARKET_ENERGY_COST;
  state.sniperLastUsedAt = Date.now();

  const myRoll = state.attack + gangAttack(state.gang) + Math.round(state.luck * 1.5) + Math.round(Math.random() * 25);
  const targetRoll = target.defense + target.luck + Math.round(Math.random() * 20);
  const success = myRoll > targetRoll;

  if (success) {
    state.hitsCompleted += 1;
    state.money += target.money;
    state.respect += target.respect;
    state.heat = Math.min(100, state.heat + applyHeatGain(30));
    toast(`☠️ Contract complete. ${target.name} is gone. +$${target.money}  +${target.respect} Respect`, 'reward');
  } else {
    state.hitsFailed += 1;
    const lost = Math.min(state.money, Math.round(state.money * 0.2) + 80);
    state.money -= lost;
    state.heat = Math.min(100, state.heat + applyHeatGain(15));
    toast(`The job fell apart. -$${lost}`, 'warn');
  }
  blackMarketTarget = null;
  updateHUD();
  renderCrimeBody();
}

function renderSecretDeals(inner) {
  if (state.secretDealsPool.length === 0) {
    const shuffled = [...SECRET_DEAL_TEMPLATES].sort(() => Math.random() - 0.5);
    state.secretDealsPool = shuffled.slice(0, 3).map(d => d.id);
  }
  const deals = state.secretDealsPool.map(id => SECRET_DEAL_TEMPLATES.find(t => t.id === id)).filter(Boolean);
  inner.innerHTML = `<p class="tiny" style="margin-bottom:8px;">Off-book deals. Permanent upgrades, no questions asked, prices aren't negotiable.</p>` +
    deals.map(d => `
      <button class="action-btn" ${state.money < d.cost ? 'disabled' : ''} onclick="buyDeal('${d.id}')">
        <div class="abtitle">${esc(d.label)} — $${d.cost}</div>
        <div class="absub">${esc(d.desc)}</div>
      </button>
    `).join('') +
    `<button class="btn secondary small" style="margin-top:4px;" onclick="refreshDeals()">🔄 New deals</button>`;
}
function refreshDeals() {
  const shuffled = [...SECRET_DEAL_TEMPLATES].sort(() => Math.random() - 0.5);
  state.secretDealsPool = shuffled.slice(0, 3).map(d => d.id);
  renderCrimeBody();
}
function buyDeal(id) {
  const d = SECRET_DEAL_TEMPLATES.find(x => x.id === id);
  if (!d || !state.secretDealsPool.includes(id) || state.money < d.cost) { toast("Can't cover that.", 'warn'); return; }
  state.money -= d.cost;
  d.apply(state);
  state.secretDealsPool = state.secretDealsPool.filter(x => x !== id);
  toast(`${d.label} — done. ${d.desc}.`, 'reward');
  updateHUD();
  renderCrimeBody();
}

      <div class="statline"><span>Deck power (top 5 cards)</span><b>${deckPower()}</b></div>
    </div>
    <button class="btn" ${state.money < CARD_PACK_COST ? 'disabled' : ''} onclick="buyPack()">🎴 Buy a Pack — $${CARD_PACK_COST}</button>
    <div class="btn-row">
      <button class="btn secondary" onclick="cardBattleView='collection';renderCardsBody()">📇 My Cards (${state.cards.length})</button>
      <button class="btn secondary" ${state.cards.length===0?'disabled':''} onclick="cardBattleView='tournament';renderCardsBody()">🏆 Tournament</button>
    </div>
  `;
}
function buyPack() {
  if (state.money < CARD_PACK_COST) { toast("Can't afford a pack.", 'warn'); return; }
  state.money -= CARD_PACK_COST;
  const card = openPack();
  state.cards.push(card);
  const r = rarityInfo(card.rarityId);
  toast(`🎴 Pulled: ${card.name} — ${r.label} (Power ${card.power})`, 'reward');
  updateHUD();
  renderCardsBody();
}
function renderMyCards(el) {
  const back = `<button class="btn secondary small" style="margin-bottom:8px;" onclick="cardBattleView='home';renderCardsBody()">⬅ Back</button>`;
  if (state.cards.length === 0) { el.innerHTML = back + `<div class="empty-hint">No cards yet. Buy a pack to get started.</div>`; return; }
  const sorted = [...state.cards].sort((a,b) => b.power - a.power);
  const top5 = new Set(sorted.slice(0,5).map(c => c.id));
  el.innerHTML = back + sorted.map(c => {
    const r = rarityInfo(c.rarityId);
    return `<div class="statline"><span>${esc(c.name)} <span class="badge ${r.id}">${r.label}</span>${top5.has(c.id)?' ⭐':''}</span><b>${c.power}</b></div>`;
  }).join('');
}
let tournamentMatch = null;
function renderTournament(el) {
  const back = `<button class="btn secondary small" style="margin-bottom:8px;" onclick="cardBattleView='home';renderCardsBody()">⬅ Back</button>`;
  if (state.cards.length === 0) { el.innerHTML = back + `<div class="empty-hint">You need at least one card to enter.</div>`; return; }
  if (state.energy < TOURNAMENT_ENERGY_COST) {
    el.innerHTML = back + `<div class="empty-hint">Too worn out to play right now (need ${TOURNAMENT_ENERGY_COST}⚡).</div>`;
    return;
  }
  if (!tournamentMatch) {
    const myDeck = deckPower();
    const oppDeck = Math.max(10, Math.round(myDeck * (0.65 + Math.random() * 0.6)));
    tournamentMatch = { myDeck, oppDeck };
  }
  el.innerHTML = back + `
    <div class="card">
      <h3>🏆 Match Found</h3>
      <div class="statline"><span>Your deck power</span><b>${tournamentMatch.myDeck}</b></div>
      <div class="statline"><span>Opponent deck power</span><b>${tournamentMatch.oppDeck}</b></div>
    </div>
    <button class="btn" onclick="playTournamentMatch()">⚔️ Play the match — ${TOURNAMENT_ENERGY_COST}⚡</button>
  `;
}
function playTournamentMatch() {
  if (!tournamentMatch || state.energy < TOURNAMENT_ENERGY_COST) { toast("Not enough energy to play.", 'warn'); return; }
  const { myDeck, oppDeck } = tournamentMatch;
  state.energy -= TOURNAMENT_ENERGY_COST;
  const myRoll = myDeck + Math.round(Math.random() * (myDeck * 0.3 + 5));
  const oppRoll = oppDeck + Math.round(Math.random() * (oppDeck * 0.3 + 5));
  const won = myRoll > oppRoll;

  if (won) {
    state.tournamentWins += 1;
    state.tournamentPoints += 10;
    const moneyGain = 40 + Math.round(myDeck * 1.5);
    state.money += moneyGain;
    let msg = `🏆 Won the match: +$${moneyGain}  +10 pts`;
    if (Math.random() < 0.15) {
      const unownedCard = NUMBER_CARDS.find(c => !state.titles.includes(c.id));
      if (unownedCard) {
        state.titles.push(unownedCard.id);
        msg += `\n🎴 Tournament NFT reward! Title Card ${unownedCard.name} awarded free.`;
      } else {
        state.money += 100;
        msg += `\n🎴 Reward paid in cash instead: +$100`;
      }
    }
    toast(msg, 'reward');
  } else {
    state.tournamentLosses += 1;
    toast(`Close match, but you lost. No penalty — just rank standing.`, 'warn');
  }
  tournamentMatch = null;
  updateHUD();
  renderCardsBody();
}

// -- Titles --
let titlesView = 'number'; // number | premium | collection
function renderTitlesBody(el) {
  el.innerHTML = `
    <p class="tiny" style="margin-bottom:8px;">No pay-to-win — these buy prestige, Underground access, and small passive perks. Skill still decides jobs, fights, and hits.</p>
    <div class="pill-row">
      <div class="pill ${titlesView==='number'?'active':''}" onclick="titlesSub('number')">🔢 Number Cards</div>
      <div class="pill ${titlesView==='premium'?'active':''}" onclick="titlesSub('premium')">👑 Premium</div>
      <div class="pill ${titlesView==='collection'?'active':''}" onclick="titlesSub('collection')">🎒 Owned</div>
    </div>
    <div id="titlesInner"></div>
  `;
  renderTitlesInner();
}
function titlesSub(v) { titlesView = v; renderTitlesBody($('cardsBody')); }
function renderTitlesInner() {
  const inner = $('titlesInner');
  if (!inner) return;
  if (titlesView === 'number') {
    inner.innerHTML = NUMBER_CARDS.map(c => {
      const owned = state.titles.includes(c.id);
      return `<button class="action-btn" ${owned || state.money < c.cost ? 'disabled' : ''} onclick="buyTitle('${c.id}')">
        <div class="abtitle">${owned?'✅ ':''}Card ${c.name} — $${c.cost}</div>
        <div class="absub">Underground access. No bonuses.</div>
      </button>`;
    }).join('');
  } else if (titlesView === 'premium') {
    inner.innerHTML = Object.values(PREMIUM_TITLES).map(t => {
      const owned = state.titles.includes(t.id);
      return `<button class="action-btn" ${owned || state.money < t.cost ? 'disabled' : ''} onclick="buyTitle('${t.id}')">
        <div class="abtitle">${owned?'✅ ':''}${t.icon} ${t.name} — $${t.cost}</div>
        <div class="absub">${esc(t.desc)}</div>
      </button>`;
    }).join('');
  } else {
    if (state.titles.length === 0) { inner.innerHTML = `<div class="empty-hint">You don't own any titles yet.</div>`; return; }
    inner.innerHTML = state.titles.map(id => {
      const premium = PREMIUM_TITLES[id];
      if (premium) return `<div class="statline"><span>${premium.icon} ${premium.name}</span><b>${esc(premium.desc)}</b></div>`;
      const card = NUMBER_CARDS.find(c => c.id === id);
      return `<div class="statline"><span>🔢 Card ${card ? card.name : id}</span><b>access only</b></div>`;
    }).join('');
  }
}
function buyTitle(id) {
  const t = PREMIUM_TITLES[id] || NUMBER_CARDS.find(c => c.id === id);
  if (!t || state.titles.includes(id) || state.money < t.cost) { toast("Can't complete that purchase.", 'warn'); return; }
  state.money -= t.cost;
  state.titles.push(id);
  const perk = t.tier === 'premium' ? t.desc : 'Underground access unlocked.';
  toast(`🎴 ${t.name} is yours. ${perk}`, 'reward');
  updateHUD();
  renderTitlesBody($('cardsBody'));
}

/* ---------------- PROFILE ---------------- */
function renderProfile() {
  const rank = rankFor(state.level);
  const f = FACTIONS[state.factionKey];
  const need = xpForLevel(state.level);
  render(`
    <div class="card">
      <h3>${esc(state.name)} — ${esc(rank.name)}</h3>
      <div class="tiny">${f.flag} ${esc(f.name)}</div>
      <div class="barwrap"><div class="bar" style="width:${Math.min(100, Math.round((state.xp/need)*100))}%"></div></div>
      <div class="tiny" style="margin-top:3px;">Level ${state.level} · ${state.xp}/${need} XP</div>
    </div>
    <div class="card">
      <div class="statline"><span>⚔️ Attack</span><b>${state.attack}</b></div>
      <div class="statline"><span>🛡 Defense</span><b>${state.defense}</b></div>
      <div class="statline"><span>🍀 Luck</span><b>${state.luck}</b></div>
      <div class="statline"><span>💰 Money</span><b>$${state.money.toLocaleString()}</b></div>
      <div class="statline"><span>🏅 Respect</span><b>${state.respect}</b></div>
      <div class="statline"><span>🌡 Heat</span><b>${state.heat} (${heatLabel(state.heat)})</b></div>
      <div class="statline"><span>⚡ Energy</span><b>${state.energy}/${state.maxEnergy}</b></div>
      <div class="statline"><span>📋 Jobs completed</span><b>${state.questsDone}</b></div>
      <div class="tiny" style="margin-top:6px;">All synced live with the server — this is real, shared data.</div>
    </div>
    <div class="card">
      <div class="row"><h3>🏆 Leaderboard</h3></div>
      <div class="pill-row">
        <div class="pill ${leaderboardSort==='respect'?'active':''}" onclick="loadLeaderboard('respect')">Respect</div>
        <div class="pill ${leaderboardSort==='money'?'active':''}" onclick="loadLeaderboard('money')">Money</div>
        <div class="pill ${leaderboardSort==='level'?'active':''}" onclick="loadLeaderboard('level')">Level</div>
      </div>
      <div id="leaderboardList"><div class="tiny">Loading…</div></div>
    </div>
    <div class="card">
      <p>Quests, Territory, Heat management, and Gang recruitment are live and server-authoritative. Gang Wars, Hitlist, Underground, Card Battle and Titles aren't connected to the backend yet — they'll show up here as they're ported over.</p>
    </div>
    <div class="card">
      <h3>Account</h3>
      <p class="tiny">Signed in as ${esc((authSession && authSession.user && authSession.user.email) || '')}</p>
      <button class="btn secondary small" onclick="logOut()">🚪 Log Out</button>
    </div>
  `);
  loadLeaderboard(leaderboardSort);
}

let leaderboardSort = 'respect';
async function loadLeaderboard(sortBy) {
  leaderboardSort = sortBy;
  const container = $('leaderboardList');
  if (!container) return;
  container.innerHTML = `<div class="tiny">Loading…</div>`;
  try {
    const data = await apiCall('GET', '/leaderboard?by=' + sortBy);
    if (!data.leaderboard.length) {
      container.innerHTML = `<div class="tiny">Nobody's on the board yet — be the first.</div>`;
      return;
    }
    container.innerHTML = data.leaderboard.slice(0, 10).map((p, i) => {
      const f = FACTIONS[p.faction_key];
      const value = sortBy === 'money' ? '$' + p.money.toLocaleString() : sortBy === 'level' ? 'Lv.' + p.level : p.respect + ' resp';
      const isMe = state && p.name === state.name;
      return `<div class="statline" style="${isMe ? 'color:#8fe0b8;' : ''}"><span>#${i+1} ${f ? f.flag : ''} ${esc(p.name)}</span><b>${value}</b></div>`;
    }).join('');
  } catch (e) {
    container.innerHTML = `<div class="tiny" style="color:#eb5757;">Could not load leaderboard: ${esc(e.message || 'unknown error')}</div>`;
  }
}

function logOut() {
  energyTimer && clearInterval(energyTimer);
  supabaseClient.auth.signOut().then(() => {
    authSession = null;
    state = null;
    $('bottomnav').style.display = 'none';
    $('hud').style.display = 'none';
    $('xpbar').style.display = 'none';
    $('onboarding').style.display = 'flex';
    startGame();
  });
}

/* ---------------- AUTH & ONBOARDING ---------------- */
async function startGame() {
  if (!CONFIG_IS_SET) {
    $('onboardingInner').innerHTML = `
      <h1>Setup needed</h1>
      <div class="lead">This file needs your Supabase URL and anon key filled in before it'll work.
      Open this HTML file in a text editor, find the MULTIPLAYER CONFIG block near the top of the
      &lt;script&gt; section, and paste in the values from your Supabase project
      (Project Settings → API). Then reload this page.</div>
    `;
    return;
  }

  supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

  $('onboardingInner').innerHTML = `<div class="lead">Loading…</div>`;
  const { data: { session } } = await supabaseClient.auth.getSession();
  if (session) {
    authSession = session;
    await tryLoadCharacter();
  } else {
    renderLoginScreen();
  }
}

async function tryLoadCharacter() {
  $('onboardingInner').innerHTML = `<div class="lead">Loading your character…</div>`;
  try {
    const data = await apiCall('GET', '/players/me');
    state = serverToState(data.player, data.gang, data.cards, data.titles);
    enterGame();
  } catch (e) {
    if (e.status === 404) {
      renderCharacterCreation();
    } else {
      $('onboardingInner').innerHTML = `
        <h1>Couldn't connect</h1>
        <div class="lead" style="color:#eb5757;">${esc(e.message || 'Unknown error')}</div>
        <button class="btn secondary" onclick="startGame()">Try again</button>
      `;
    }
  }
}

/* --- Login / Sign up --- */
function renderLoginScreen(mode) {
  mode = mode || 'login';
  $('onboardingInner').innerHTML = `
    <h1>MOB 🕵️</h1>
    <div class="lead">${mode === 'signup' ? 'Create an account to start your empire.' : 'Welcome back.'}</div>
    <input id="authEmail" type="email" placeholder="Email" autocomplete="username" />
    <input id="authPassword" type="password" placeholder="Password (6+ characters)" autocomplete="${mode === 'signup' ? 'new-password' : 'current-password'}" />
    <div id="authError" class="tiny" style="color:#eb5757;margin-bottom:8px;"></div>
    <button class="btn" onclick="${mode === 'signup' ? 'doSignUp()' : 'doLogIn()'}">${mode === 'signup' ? 'Sign Up' : 'Log In'}</button>
    <button class="btn secondary" style="margin-top:8px;" onclick="renderLoginScreen('${mode === 'signup' ? 'login' : 'signup'}')">
      ${mode === 'signup' ? 'Already have an account? Log in' : "New here? Create an account"}
    </button>
  `;
  $('authPassword').addEventListener('keydown', e => {
    if (e.key === 'Enter') (mode === 'signup' ? doSignUp() : doLogIn());
  });
}

function authFields() {
  return { email: $('authEmail').value.trim(), password: $('authPassword').value };
}

async function doSignUp() {
  const { email, password } = authFields();
  $('authError').textContent = '';
  if (!email || password.length < 6) {
    $('authError').textContent = 'Enter a valid email and a password of at least 6 characters.';
    return;
  }
  const { data, error } = await supabaseClient.auth.signUp({ email, password });
  if (error) { $('authError').textContent = error.message; return; }
  if (!data.session) {
    $('onboardingInner').innerHTML = `
      <h1>Check your email</h1>
      <div class="lead">We sent a confirmation link to ${esc(email)}. Confirm it, then come back and log in.</div>
      <button class="btn secondary" onclick="renderLoginScreen('login')">Back to log in</button>
    `;
    return;
  }
  authSession = data.session;
  await tryLoadCharacter();
}

async function doLogIn() {
  const { email, password } = authFields();
  $('authError').textContent = '';
  const { data, error } = await supabaseClient.auth.signInWithPassword({ email, password });
  if (error) { $('authError').textContent = error.message; return; }
  authSession = data.session;
  await tryLoadCharacter();
}

/* --- Character creation (only reached once logged in with no character yet) --- */
function renderCharacterCreation() {
  $('onboardingInner').innerHTML = `
    <h1>MOB 🕵️</h1>
    <div class="lead">Nobody knows your name yet. Nobody respects you yet.<br><br>Every empire starts with one person willing to take the first risk. That's you.</div>
    <input id="nameInput" type="text" placeholder="Your boss name" maxlength="16" />
    <button class="btn" onclick="submitName()">Continue</button>
  `;
  $('nameInput').addEventListener('keydown', e => { if (e.key === 'Enter') submitName(); });
  $('nameInput').focus();
}
function submitName() {
  const val = $('nameInput').value.trim();
  if (!val) return;
  window.__pendingName = val;
  renderFactionPicker();
}
function renderFactionPicker() {
  $('onboardingInner').innerHTML = `
    <h1>Pick your family</h1>
    <div class="lead">${esc(window.__pendingName)} — a name people will learn to fear. Your faction shapes your whole playstyle.</div>
    ${Object.entries(FACTIONS).map(([key, f]) => `
      <div class="faction-card" onclick="createCharacter('${key}')">
        <div class="fname">${f.flag} ${esc(f.name)}</div>
        <div class="fdesc">${esc(f.desc)}</div>
      </div>
    `).join('')}
    <div id="createError" class="tiny" style="color:#eb5757;margin-top:8px;"></div>
  `;
}
async function createCharacter(factionKey) {
  $('onboardingInner').innerHTML = `<div class="lead">Setting up…</div>`;
  try {
    await apiCall('POST', '/players', { name: window.__pendingName, factionKey });
    await tryLoadCharacter();
  } catch (e) {
    renderFactionPicker();
    $('createError').textContent = e.message || 'Could not create character.';
  }
}

/* --- Adapts the server's player row (snake_case, minimal) into the client's richer
   local `state` shape. Systems not yet wired to the backend (gang, territory, cards
   beyond what's returned, titles beyond ownership, pvp/hitlist history) get sensible
   empty defaults — they're inert until those systems are ported. --- */
function serverToState(p, gang, cards, titleIds) {
  return {
    name: p.name, factionKey: p.faction_key,
    level: p.level, xp: p.xp, xpBoost: p.xp_boost || 0,
    money: p.money, respect: p.respect,
    energy: p.energy, maxEnergy: p.max_energy,
    heat: p.heat, everWanted: p.ever_wanted,
    attack: p.attack, defense: p.defense, luck: p.luck,
    questsDone: p.quests_done, specialDone: p.special_done || [],
    gang: (gang || []).map(g => ({ id: g.id, name: g.name, attack: g.attack, defense: g.defense, loyalty: g.loyalty })),
    cards: (cards || []).map(c => ({ id: c.id, name: c.name, rarityId: c.rarity_id, power: c.power })),
    titles: titleIds || [],
    pvpWins: p.pvp_wins, pvpLosses: p.pvp_losses,
    hitsCompleted: p.hits_completed, hitsFailed: p.hits_failed, hitsSurvived: p.hits_survived,
    tournamentWins: p.tournament_wins, tournamentLosses: p.tournament_losses, tournamentPoints: p.tournament_points,
    territoriesCaptured: p.territories_captured, rivalsEliminated: p.rivals_eliminated,
    // Not backend-synced yet — these tabs are gated off in the UI (see requiresBackend()):
    recruitPool: [], rivals: [], hitlistBoard: [], secretDealsPool: [], districts: [], rivalGrudge: {},
    sniperLastUsedAt: 0, log: [], serverId: p.id,
  };
}

function enterGame() {
  $('onboarding').style.display = 'none';
  $('bottomnav').style.display = 'grid';
  updateHUD();
  startEnergyRegen();
  setTab('home');
}

function startEnergyRegen() {
  if (energyTimer) clearInterval(energyTimer);
  // Energy regen is computed server-side from real elapsed time (see gameLogic.js
  // applyEnergyRegen). The client just periodically re-fetches to stay in sync —
  // it never invents energy locally anymore.
  energyTimer = setInterval(async () => {
    if (!state || !authSession) return;
    try {
      const data = await apiCall('GET', '/players/me');
      if (data.player.energy !== state.energy) {
        state.energy = data.player.energy;
        state.maxEnergy = data.player.max_energy;
        updateHUD();
        if (currentTab === 'jobs') renderJobsBody();
      }
    } catch (e) { /* transient network hiccup — try again next tick */ }
  }, 30000);
}

function showFatalError(context, err) {
  try {
    const msg = (err && err.message) ? err.message : String(err);
    const stack = (err && err.stack) ? err.stack : '';
    document.body.innerHTML =
      '<div style="max-width:480px;margin:0 auto;padding:24px;font-family:-apple-system,Segoe UI,Roboto,sans-serif;' +
      'background:#17181a;color:#e8e6e3;min-height:100vh;box-sizing:border-box;">' +
      '<h2 style="color:#eb5757;margin-top:0;">Something broke while loading MOB</h2>' +
      '<p style="color:#a9a9ae;font-size:13px;">Context: ' + context + '</p>' +
      '<pre style="white-space:pre-wrap;background:#0e0e10;border:1px solid #333;border-radius:8px;' +
      'padding:12px;font-size:12px;color:#f2c14e;overflow-x:auto;">' + msg + (stack ? '\n\n' + stack : '') + '</pre>' +
      '<p style="color:#8a8a8f;font-size:12px;">Copy the text above and share it so this can be fixed.</p>' +
      '</div>';
  } catch (e2) { /* last resort: leave whatever is on screen */ }
}

window.addEventListener('error', (e) => {
  showFatalError('runtime error', e.error || e.message || e);
});
window.addEventListener('unhandledrejection', (e) => {
  showFatalError('unhandled promise rejection', e.reason);
});

try {
  const p = startGame();
  if (p && typeof p.catch === 'function') p.catch(err => showFatalError('startGame() rejected', err));
} catch (err) {
  showFatalError('startGame() threw synchronously', err);
}
</script>
